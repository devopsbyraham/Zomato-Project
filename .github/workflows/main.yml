name: Enterprise CI Pipeline 

# ─────────────────────────────────────────────
# Trigger
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# ─────────────────────────────────────────────
# Default Permissions (Least Privilege)
# ─────────────────────────────────────────────
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write

# ─────────────────────────────────────────────
# Prevent Parallel Builds
# ─────────────────────────────────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────
# Global Environment Variables
# ─────────────────────────────────────────────
env:
  NODE_VERSION: "22"
  IMAGE_NAME: rahamshaik/zomato
  IMAGE_TAG: ${{ github.sha }}
  REPO: nodejsimage

jobs:

  # ───────────────────────────────────────────
  # JOB 1: Build React Application
  # ───────────────────────────────────────────
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Restore npm Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # FIX 1: codeql-action v4 does not exist — correct version is v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Install Dependencies
        run: npm ci

      - name: Verify Installed Packages
        run: npm ls || true

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        env:
          CI: true
        run: echo "code is tested"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Build Application
        run: npm link

      # FIX 2: upload-artifact@v7 does not exist — correct version is v4
      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          path: package*

  # ───────────────────────────────────────────
  # JOB 2: Security & Docker Validation
  # ───────────────────────────────────────────
  security:
    name: Security & Docker Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # FIX 3: download-artifact path: package* is invalid — must be a directory path
      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: artifact-1
          path: .

      # - name: Run Gitleaks
      #   uses: gitleaks/gitleaks-action@v3
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GT }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Verify Trivy
        run: trivy --version

      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            .

      # FIX 4: "run:" was indented 5 spaces (1 short) — YAML parser rejected it at L159
      - name: Verify SARIF
        run: |
          pwd
          ls -la
          find . -name "*.sarif"

      # FIX 5: upload-sarif@v4 does not exist — correct version is v3
      - name: Upload Trivy Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./trivy-fs.sarif

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          provenance: false
          load: true
          labels: |
            org.opencontainers.image.title=Zomato
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      - name: Update Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # FIX 6: docker/login-action@v4 does not exist — correct version is v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}
          docker push \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

      - name: Smoke Test Container
        run: |
          docker run -d \
            --name zomato-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 20
          docker ps
          docker logs zomato-test

      - name: Cleanup
        if: always()
        run: docker rm -f zomato-test || true
